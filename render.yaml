services:
  - type: web
    name: vs-tahta-relay
    runtime: python
    rootDir: relay
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    plan: free
